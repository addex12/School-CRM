<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* General Reset */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fa;
        }

        /* Sidebar Styling */
        .admin-sidebar {
            width: 240px;
            background: #222d32;
            color: #fff;
            min-height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 100;
            transition: width 0.2s;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        .admin-sidebar.collapsed {
            width: 60px;
        }

        .sidebar-header {
            padding: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            background: #1976d2;
            color: #fff;
            text-align: center;
        }

        .sidebar-toggle {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            margin-left: auto;
        }

        .admin-sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .admin-sidebar ul li a {
            display: flex;
            align-items: center;
            padding: 0.8rem 1rem;
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .admin-sidebar ul li a:hover {
            background: #34495e;
        }

        .admin-sidebar ul li a i {
            margin-right: 1rem;
        }

        /* Main Content Area */
        .admin-main {
            margin-left: 240px;
            padding: 1.5rem;
            transition: margin-left 0.2s;
        }

        .admin-sidebar.collapsed ~ .admin-main {
            margin-left: 60px;
        }

        /* Header Styling */
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .admin-header h1 {
            margin: 0;
            font-size: 1.8rem;
            color: #34495e;
        }

        .btn-primary {
            background: #2e9cf1;
            border: 1px solid #1d7dbc;
            border-radius: 4px;
            padding: 8px 16px;
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #1d7dbc;
        }

        /* Responsive Card Design */
        .widget-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .dashboard-widget {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(44, 62, 80, 0.1);
            padding: 1.5rem;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .dashboard-widget:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 16px rgba(44, 62, 80, 0.2);
        }

        .dashboard-widget i {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #2e9cf1;
        }

        .dashboard-widget h3 {
            font-size: 1.8rem;
            margin: 0.5rem 0;
            color: #34495e;
        }

        .dashboard-widget p {
            color: #7f8c8d;
            font-size: 1rem;
        }

        /* Footer Styling */
        .admin-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #34495e;
            color: #fff;
            padding: 1rem;
            text-align: center;
            font-size: 0.9rem;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .admin-main {
                margin-left: 0;
            }

            .admin-sidebar {
                width: 100vw;
                position: absolute;
                left: -100vw;
                transition: left 0.2s;
            }

            .admin-sidebar.open {
                left: 0;
            }

            .admin-footer {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="admin-dashboard">
        <!-- Sidebar -->
        <div class="admin-sidebar" id="adminSidebar">
            <div class="sidebar-header">
                Admin Panel
                <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
            </div>
            <ul>
                <li><a href="#"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="#"><i class="fas fa-users"></i> Users</a></li>
                <li><a href="#"><i class="fas fa-poll"></i> Surveys</a></li>
                <li><a href="#"><i class="fas fa-envelope"></i> Messages</a></li>
                <li><a href="#"><i class="fas fa-cogs"></i> Settings</a></li>
                <li><a href="#"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="admin-main">
            <header class="admin-header">
                <h1>Dashboard</h1>
                <a href="#" class="btn-primary">New Action</a>
            </header>

            <!-- Widgets -->
            <div class="widget-grid">
                <div class="dashboard-widget">
                    <i class="fas fa-users"></i>
                    <h3>150</h3>
                    <p>Total Users</p>
                </div>
                <div class="dashboard-widget">
                    <i class="fas fa-ticket-alt"></i>
                    <h3>25</h3>
                    <p>Open Tickets</p>
                </div>
                <div class="dashboard-widget">
                    <i class="fas fa-comments"></i>
                    <h3>10</h3>
                    <p>Feedbacks</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="admin-footer">
        &copy; <?= date('Y') ?> School CRM. All rights reserved.
    </footer>

    <script>
        // Sidebar Toggle
        document.getElementById('sidebarToggle').addEventListener('click', function () {
            const sidebar = document.getElementById('adminSidebar');
            sidebar.classList.toggle('open');
        });
    </script>
</body>
</html>

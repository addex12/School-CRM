# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL Advanced"

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  schedule:
    - cron: '35 18 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners (GitHub.com only)
    # Consider using larger runners or machines with greater resources for possible analysis time improvements.
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: javascript-typescript
          build-mode: none
        - language: php
          build-mode: none
        # Remove python if you do not have Python code in your repo.
        # - language: python
        #   build-mode: none
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Add any setup steps before running the `github/codeql-action/init` action.
    # This includes steps like installing compilers or runtimes (`actions/setup-node`
    # or others). This is typically only required for manual builds.
    # - name: Setup runtime (example)
    #   uses: actions/setup-example@v1

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.

        # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality

    # If the analyze step fails for one of the languages you are analyzing with
    # "We were unable to automatically build your code", modify the matrix above
    # to set the build mode to "manual" for that language. Then modify this step
    # to build your code.
    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun
    - if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        echo 'If you are using a "manual" build mode for one or more of the' \
          'languages you are analyzing, replace this with the commands to build' \
          'your code, for example:'
        echo '  make bootstrap'
        echo '  make release'
        exit 1

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"

    # Lightlytics Publisher step for Terraform plan publishing and analysis
    - name: Lightlytics Publisher
      # You may pin to the exact commit or the version.
      # uses: lightlytics/publisher@0dbe04a6743c38e602f504a4ccefd9935c243d3f
      uses: lightlytics/publisher@latest
      with:
        # Relative path to the directory of which terraform init command executed
        working-directory: ./terraform
        # Hostname of Lightlytics environment (example: env.lightlytics.com)
        ll-hostname: "env.lightlytics.com"
        # Relative path to Terraform plan file (JSON format)
        plan-json: "" # optional
        # Optional, Terraform Cloud token used to retrieve terraform plan output
        tfc-token: "" # optional
        # Optional, Terraform Cloud run id that was created after using terraform plan command
        tfc-run-id: "" # optional
        # Relative path to Terraform graph file (dot format)
        tf-graph: "" # optional, provide the path to the Terraform graph file
        # Secret token per customer used for authentication with Lightlytics (stored in GitHub)
        collection-token: ${{ secrets.COLLECTION_TOKEN }}
        # GitHub token used to send a comment on Pull requests
        github-token: ${{ secrets.GITHUB_TOKEN }} # optional

# --- FIX: To resolve "CodeQL analyses from advanced configurations cannot be processed when the default setup is enabled":
# 1. Go to your repository on GitHub.
# 2. Navigate to: Security > Code scanning alerts > CodeQL.
# 3. Click "Disable" on the default CodeQL setup (if enabled).
# 4. Keep only this advanced (custom) workflow active.
# 5. Re-run your workflow.
# See: https://docs.github.com/en/code-security/code-scanning/using-codeql-code-scanning-with-your-existing-ci-system/troubleshooting-codeql-workflows#codeql-analyses-from-advanced-configurations-cannot-be-processed-when-the-default-setup-is-enabled

# --- IMPORTANT: To resolve "Code Scanning could not process the submitted SARIF file":
# This error is caused by having both the default CodeQL setup and an advanced (custom) CodeQL workflow enabled.
# 
# To fix:
# 1. Go to your repository on GitHub.
# 2. Navigate to: Security > Code scanning alerts > CodeQL.
# 3. Click "Disable" on the default CodeQL setup (if enabled).
# 4. Keep only this advanced (custom) workflow active.
# 5. Commit and push your changes, then re-run your workflow.
#
# Reference: https://docs.github.com/en/code-security/code-scanning/using-codeql-code-scanning-with-your-existing-ci-system/troubleshooting-codeql-workflows#codeql-analyses-from-advanced-configurations-cannot-be-processed-when-the-default-setup-is-enabled
